name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    env:
      GOWORK: "off"
      GOFLAGS: "-mod=readonly"
    runs-on:
      - self-hosted
      - linux
      - x64
      - terraform-provider-phala
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Resolve Go SDK ref
        id: sdkref
        run: |
          # Stacked PRs may pair this branch with a same-named branch in
          # Phala-Network/phala-cloud. Use it when it exists; otherwise fall
          # back to the last phala-cloud main commit this provider builds
          # against. Later SDK commits replace teepod/node IDs with physical
          # node names (phala-cloud #532, #538); fall back to main once the
          # provider adopts node-name placement.
          branch="${{ github.head_ref || github.ref_name }}"
          if git ls-remote --exit-code --heads https://github.com/Phala-Network/phala-cloud.git "$branch" > /dev/null 2>&1; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=32cd8b15f6e9639f972e5c8185ad2c9617bea14d" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout Go SDK (for replace directive ../go)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: Phala-Network/phala-cloud
          ref: ${{ steps.sdkref.outputs.ref }}
          path: phala-cloud
          sparse-checkout: go
          sparse-checkout-cone-mode: true
      - run: rm -rf ../go && mv phala-cloud/go ../go && rm -rf phala-cloud
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85
        with:
          terraform_wrapper: false
      - run: make generate
      - name: Check generated docs
        run: git diff --exit-code
      - run: make ci
